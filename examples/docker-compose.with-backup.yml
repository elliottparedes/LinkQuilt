# Optional overlay for the bundled stack. Schedule this one-shot job from the host.
# docker compose -f docker-compose.yml -f examples/docker-compose.with-backup.yml run --rm backup
services:
  backup:
    image: postgres:17-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${LINKBREEZE_POSTGRES_PASSWORD:?Set LINKBREEZE_POSTGRES_PASSWORD}
    volumes:
      - linkbreeze-data:/app/data:ro
      - linkbreeze-backups:/backups
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        umask 077
        staging=$$(mktemp -d /backups/.snapshot.XXXXXXXX)
        pg_dump -h postgres -U linkbreeze -d linkbreeze -Fc --no-owner -f "$$staging/database.dump"
        tar -czf "$$staging/app-data.tar.gz" -C /app/data .
        mv "$$staging" "/backups/linkbreeze-$$(date -u +%Y%m%dT%H%M%SZ)"

volumes:
  linkbreeze-backups:
