# Set LINKBREEZE_POSTGRES_PASSWORD to a URL-safe random string before starting.
services:
  linkbreeze:
    image: linkbreeze:local
    build: .
    ports:
      - '3000:3000'
    volumes:
      - linkbreeze-data:/app/data
    environment:
      DATABASE_URL: postgresql://linkbreeze:${LINKBREEZE_POSTGRES_PASSWORD:?Set LINKBREEZE_POSTGRES_PASSWORD}@postgres:5432/linkbreeze
      SECRET_KEY: ${SECRET_KEY:-}
      LINKBREEZE_START_FRESH: ${LINKBREEZE_START_FRESH:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: linkbreeze
      POSTGRES_DB: linkbreeze
      POSTGRES_PASSWORD: ${LINKBREEZE_POSTGRES_PASSWORD:?Set LINKBREEZE_POSTGRES_PASSWORD}
    volumes:
      - linkbreeze-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, linkbreeze, -d, linkbreeze]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  linkbreeze-data:
  linkbreeze-postgres:
