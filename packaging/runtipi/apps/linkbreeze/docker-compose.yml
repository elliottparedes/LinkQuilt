services:
  linkbreeze:
    image: ghcr.io/elliottparedes/linkquilt:v2.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LINKBREEZE_DATABASE_URL}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
